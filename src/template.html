<body>
<div id="storage-warning" class="storage-warning hidden"></div>
<header class="app-header">
  <div class="header-inner">
    <div class="brand"><div class="brand-mark" aria-hidden="true">CB</div><div class="brand-copy"><div class="brand-title">Conexión Bíblica 2026</div><div class="brand-sub">Precisión · memoria · retención</div></div></div>
    <div class="header-spacer"></div><div id="header-date" class="header-date"></div>
    <button class="icon-btn" id="theme-btn" aria-label="Cambiar tema" title="Cambiar tema">◐</button>
  </div>
</header>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Navegación principal">
    <button data-view="home" class="active"><span class="nav-icon">⌂</span><span>Inicio</span></button>
    <button data-view="train"><span class="nav-icon">◎</span><span>Entrenar</span></button>
    <button data-view="text"><span class="nav-icon">▤</span><span>Texto</span></button>
    <button data-view="progress"><span class="nav-icon">↗</span><span>Progreso</span></button>
    <button data-view="audit"><span class="nav-icon">✓</span><span>Auditoría</span></button>
    <button data-view="settings"><span class="nav-icon">⚙</span><span>Ajustes</span></button>
  </nav>
  <main class="main" id="app" tabindex="-1"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="modal-root"></div>
<input id="file-input" type="file" accept="application/json,.json" class="hidden">
<script>
'use strict';
const DATA=__APP_DATA__;
const BASE_QUESTIONS=DATA.questions;
const STORAGE_KEY='conexion-biblica-2026:v4:state';
const SCHEMA_VERSION=4;
const MS_DAY=86400000;
let memoryOnly=false;
let state;
let currentView='home';
let renderTicker=null;
let thinkTicker=null;
let fileIntent='';
let toastTimer=null;

const $=(s,root=document)=>root.querySelector(s);
const $$=(s,root=document)=>[...root.querySelectorAll(s)];
const esc=(v='')=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

 if(t<'2026-08-09')return{title:'Primera cobertura',text:'Ver todo el material y comenzar el reaprendizaje antes de la semana final.'};

// Metrics and readiness
function chapterQuestions(ch){return getQuestions().filter(q=>q.chapter===ch)}
function chapterAnswers(ch){return state.answers.filter(a=>a.chapter===ch)}
function accuracy(arr){const answered=arr.filter(a=>!a.skipped);return answered.length?100*answered.filter(a=>a.correct).length/answered.length:0}
function persistentForChapter(ch){return chapterQuestions(ch).filter(q=>{const p=progressFor(q.id);return p.persistent||p.errors>=2&&p.status!=='Dominada'}).length}
function timeSamples(filter={}){let arr=state.answers.filter(a=>a.correct&&!a.skipped&&a.confidence!=='Adiviné'&&!a.interrupted&&a.activeMs>=1000);
 if(filter.chapter)arr=arr.filter(a=>a.chapter===filter.chapter);if(filter.type)arr=arr.filter(a=>a.type===filter.type);if(filter.difficulty)arr=arr.filter(a=>a.difficulty===filter.difficulty);return iqrFiltered(arr.map(a=>a.activeMs))}

function refreshTimeGoals(){for(const ch of getProfiles().filter(p=>p.chapter!=='Banco combinado').map(p=>p.chapter)){const g=timeGoal(ch);if(!g.ready)continue;const prev=state.timeGoals[g.key];state.timeGoals[g.key]={targetMs:g.targetMs,updatedAt:new Date().toISOString(),history:[...(prev?.history||[]),g.targetMs].slice(-10)}}}
function readiness(ch){const qs=chapterQuestions(ch),ans=chapterAnswers(ch),recent=ans.filter(a=>!a.skipped).slice(-60),hard=recent.filter(a=>['difícil','trampa'].includes(a.difficulty));const attempted=qs.filter(q=>progressFor(q.id).attempts>0).length;const coverage=100*attempted/Math.max(1,qs.length);const recentAcc=accuracy(recent);const hardAcc=accuracy(hard);const correctDays=uniq(ans.filter(a=>a.correct).map(a=>a.date)).length;const delayed=qs.filter(q=>progressFor(q.id).delayedCheck).length;const retention=attempted?100*delayed/attempted:0;const attemptedCount=qs.filter(q=>progressFor(q.id).attempts>0).length;const corrected=qs.filter(q=>{const p=progressFor(q.id);return p.errors>0&&p.history.slice(-2).every(h=>h.correct)}).length;const everWrong=qs.filter(q=>progressFor(q.id).errors>0).length;const correction=attemptedCount?(everWrong?100*corrected/everWrong:recentAcc):0;const tg=timeGoal(ch);const validTimes=timeSamples({chapter:ch});const timeEff=tg.ready&&validTimes.length?clamp(100*tg.targetMs/percentile(validTimes,.5),0,100):0;let score=.30*recentAcc+.20*hardAcc+.20*retention+.15*coverage+.10*correction+.05*timeEff;const persistent=persistentForChapter(ch);if(correctDays<2)score=Math.min(score,92);if(persistent)score=Math.min(score,96);if(coverage<100)score=Math.min(score,96);score=round(score);let label=score<70?'Base incompleta':score<85?'En construcción':score<93?'Buen avance':score<97?'Competitivo, todavía vulnerable':score<100?'Muy preparado':'Evidencia completa de dominio';const ready=coverage===100&&persistent===0&&correctDays>=2&&score>=97;return{score,label,ready,recentAcc,hardAcc,retention,coverage,correction,timeEff,persistent,correctDays,attempted,total:qs.length}}

function statusCounts(){const c=CounterLike(allProgress().map(x=>x.p.status));return c}
function CounterLike(items){const o={};for(const x of items)o[x]=(o[x]||0)+1;return o}
function currentUrgencyLabel(){const n=nextDeadline();return `Urgente para ${n.label.toLowerCase()}`}
function computeStatus(q,p,lastCorrect){const hist=p.history,days=Object.keys(p.correctDays||{}).length,recentError=hist.slice(-3).some(h=>!h.correct);const mastered=p.correct>=3&&days>=2&&p.securePractice&&p.delayedCheck&&p.hardVariantCorrect&&!recentError;if(!lastCorrect&&p.status==='Dominada')return'Recaída';if(mastered)return'Dominada';if(!lastCorrect){if(daysUntil(nextDeadline().date)<=7)return currentUrgencyLabel();return p.errors>=2?'Débil':'En aprendizaje'}const conditions=[p.correct>=3,days>=2,p.securePractice,p.delayedCheck,p.hardVariantCorrect,!recentError].filter(Boolean).length;if(conditions>=5)return'Casi dominada';if(p.correct>=2)return'En progreso';return'En aprendizaje'}
function scheduleDue(p,answer){const deadline=nextDeadline().date;let days=1;if(!answer.correct||answer.confidence==='Adiviné'||answer.confidence==='Dudé')days=1;else{const distinct=Object.keys(p.correctDays).length;if(distinct<=1)days=1;else if(distinct===2)days=3;else if(distinct===3)days=6;else days=12}let due=addDays(answer.date,days);if(p.status!=='Dominada'&&due>=deadline)due=addDays(deadline,-1);p.nextDue=due}
function inferErrorTag(q,a){if(a.activeMs<1000)return'respondí impulsivamente';if(q.detail==='nombre'||q.detail==='persona'||q.detail==='personas'||q.detail==='cargo'||q.detail==='quién dijo')return'confundí nombre/persona';if(q.detail==='cantidad'||q.detail==='tiempo')return'confundí cantidad';if(q.detail==='orden')return'confundí orden';if(q.detail==='fuente')return'confundí fuente';if(q.detail==='frase exacta')return'no recordé frase exacta';if(q.detail==='negación')return'no vi una negación';return'no lo sabía'}
function applyProgress(answer){if(!answer||answer.processed)return;const q=questionById(answer.qid);if(!q)return;answer.processed=true;const global=state.answers.find(x=>x.id===answer.id);if(global)global.processed=true;const p=progressFor(answer.qid),prevLast=p.lastDate;p.attempts++;p.lastDate=answer.date;p.history.push({date:answer.date,correct:answer.correct,confidence:answer.confidence,time:answer.activeMs,mode:answer.mode});p.history=p.history.slice(-12);p.avgTime=((p.avgTime*(p.attempts-1))+answer.activeMs)/p.attempts;if(answer.correct){p.correct++;p.streak++;p.correctDays[answer.date]=true;if(!p.firstCorrectDate)p.firstCorrectDate=answer.date;if(answer.confidence==='Seguro'&&!answer.isFinal)p.securePractice=true;if(['difícil','trampa'].includes(q.difficulty))p.hardVariantCorrect=true;if(prevLast&&prevLast!==answer.date)p.delayedCheck=true}else{p.errors++;p.streak=0;if(answer.confidence==='Seguro')p.safeErrors++;p.errorTag=inferErrorTag(q,answer)}if(answer.confidence)p.confidence[answer.confidence]=(p.confidence[answer.confidence]||0)+1;p.persistent=p.errors>=2&&!p.history.slice(-2).every(h=>h.correct);p.status=computeStatus(q,p,answer.correct);scheduleDue(p,answer)}

// Adaptive selection
function priority(q){const p=progressFor(q.id),due=p.nextDue<=todayKey()?35:0,err=Math.min(30,p.errors*7),safe=Math.min(30,p.safeErrors*15),recur=p.status==='Recaída'?30:0,urgent=p.status.startsWith('Urgente')?28:0,weak=['Débil','En aprendizaje'].includes(p.status)?15:0,newp=p.attempts===0?12:0,diff=['difícil','trampa'].includes(q.difficulty)?7:0,stable=p.status==='Dominada'?25:0;return due+err+safe+recur+urgent+weak+newp+diff-stable+Math.random()}
function filterQuestions(cfg={}){let qs=getQuestions();if(cfg.chapter&&cfg.chapter!=='all')qs=qs.filter(q=>q.chapter===cfg.chapter);if(cfg.source&&cfg.source!=='all')qs=qs.filter(q=>q.source===cfg.source);if(cfg.type&&cfg.type!=='all')qs=qs.filter(q=>q.type===cfg.type);if(cfg.difficulty&&cfg.difficulty!=='all')qs=qs.filter(q=>q.difficulty===cfg.difficulty);if(cfg.reference)qs=qs.filter(q=>q.reference===cfg.reference);return qs}
function interleave(list){const out=[],pool=[...list];while(pool.length){let idx=pool.findIndex(q=>{const last=out.slice(-2);return !(last.length===2&&last.every(x=>x.reference===q.reference))&&!(last.length===2&&last.every(x=>x.type===q.type))});if(idx<0)idx=0;out.push(pool.splice(idx,1)[0])}return out}
function adaptivePick(cfg,n){const all=filterQuestions(cfg);const due=all.filter(q=>{const p=progressFor(q.id);return p.attempts>0&&(p.nextDue<=todayKey()||p.status.startsWith('Urgente')||p.status==='Recaída')}).sort((a,b)=>priority(b)-priority(a));const weak=all.filter(q=>{const p=progressFor(q.id);return p.errors||p.confidence?.['Dudé']||p.confidence?.['Adiviné']||p.status==='Débil'}).sort((a,b)=>priority(b)-priority(a));const fresh=all.filter(q=>progressFor(q.id).attempts===0).sort((a,b)=>priority(b)-priority(a));const stable=all.filter(q=>['Casi dominada','Dominada','En progreso'].includes(progressFor(q.id).status)).sort((a,b)=>priority(b)-priority(a));const chosen=[];const take=(arr,k)=>{for(const q of arr){if(chosen.length>=n||k<=0)break;if(!chosen.some(x=>x.id===q.id)){chosen.push(q);k--}}};take(due,Math.ceil(n*.35));take(weak,Math.ceil(n*.30));take(fresh,Math.ceil(n*.20));take(stable,Math.ceil(n*.15));take([...all].sort((a,b)=>priority(b)-priority(a)),n-chosen.length);return interleave(chosen.slice(0,n))}

function modeTitle(m){return({learn:'Aprender capítulo',adaptive:'Práctica adaptativa',precision:'Precisión',persistent:'Romper errores persistentes',errors:'Repasar errores',hard:'Difícil y trampa',final:'Modo Final','simulation-church':'Simulacro de iglesia','simulation-district':'Simulacro de distrito','simulation-association':'Simulacro de asociación',marathon:'Maratón',free5:'Rato libre · 5 min',free10:'Rato libre · 10 min',night45:'Entrenamiento nocturno · 45 min',night75:'Entrenamiento nocturno · 60–90 min',emergency:'Mínimo de emergencia'})[m]||'Entrenamiento'}

function submitCurrent(skipped=false){const s=session(),q=currentQuestion();if(!s||!q||!['answering','thinking'].includes(s.stage))return;if(!skipped&&s.stage==='thinking'){revealOptions();return}if(!skipped&&s.selected===null){toast('Selecciona una respuesta antes de confirmar.',true);return}stopQuestionTimer();const opts=runtimeOptions(q),selected=skipped?null:opts[s.selected],correct=!skipped&&selected===q.correctAnswer;const a={id:id(),qid:q.id,question:q.prompt,chapter:q.chapter,source:q.source,reference:q.reference,type:q.type,difficulty:q.difficulty,detail:q.detail,family:q.family,selected,correctAnswer:q.correctAnswer,correct,skipped,activeMs:activeElapsed(),date:todayKey(),at:new Date().toISOString(),confidence:null,mode:s.mode,isFinal:s.isFinal,interrupted:!!s.qTimer?.interrupted};s.answers.push(a);state.answers.push(a);state.studyDays[a.date]=true;s.lastAnswerId=a.id;if(s.isFinal){applyProgress(a);s.stage='saved';saveState();setTimeout(()=>nextQuestion(),300)}else{if(skipped){applyProgress(a);scheduleReappearance(a)}s.stage='feedback';s.feedbackStarted=Date.now();saveState();render()} }

function scheduleReappearance(a){const s=session(),q=questionById(a.qid);if(!s||s.isFinal||s.mode==='marathon')return;const count=s.reinsertCount[q.id]||0;if(count>=2)return;const insertUnique=(qid,offset)=>{const pos=Math.min(s.queue.length,s.cursor+offset),lo=Math.max(s.cursor+1,pos-1),hi=Math.min(s.queue.length,pos+2);if(!s.queue.slice(lo,hi).includes(qid))s.queue.splice(pos,0,qid)};if(!a.correct){const rank={fácil:0,media:1,difícil:2,trampa:3};const related=getQuestions().filter(x=>x.id!==q.id&&x.family===q.family).sort((x,y)=>(rank[x.difficulty]??9)-(rank[y.difficulty]??9))[0];if(related)insertUnique(related.id,2+Math.floor(Math.random()*3));insertUnique(q.id,5+Math.floor(Math.random()*5));insertUnique(q.id,Math.max(8,s.queue.length-s.cursor));s.reinsertCount[q.id]=count+1}else if(a.confidence==='Adiviné'){insertUnique(q.id,8+Math.floor(Math.random()*8));insertUnique(q.id,Math.max(10,s.queue.length-s.cursor));s.reinsertCount[q.id]=count+1}else if(a.confidence==='Dudé'){insertUnique(q.id,Math.max(5,s.queue.length-s.cursor));s.reinsertCount[q.id]=count+1}}

function modeCard(title,text,onclick,badge){return`<div class="mode-card"><span class="badge accent" style="align-self:flex-start">${esc(badge)}</span><h3 style="margin-top:12px">${esc(title)}</h3><p>${esc(text)}</p><button class="btn" onclick="${onclick}">Comenzar</button></div>`}
function startFiltered(){startMode('adaptive',{chapter:state.ui.trainChapter,type:$('#filter-type').value,difficulty:$('#filter-diff').value,count:Number($('#filter-count').value)})}
function renderSession(){const s=session(),q=currentQuestion();if(!s||!q)return`<div class="callout warn">No hay una sesión activa. <button class="btn" onclick="setView('train')">Volver</button></div>`;const opts=runtimeOptions(q),a=currentAnswer(),feedback=['feedback','next'].includes(s.stage),isExit=s.cursor>=s.initialCount;return`<section class="page session-shell">
<div class="session-top"><button class="icon-btn" onclick="exitSession()" aria-label="Salir">←</button><div class="session-progress"><div class="progress-track"><div class="progress-fill" style="--value:${100*s.cursor/Math.max(1,s.queue.length)}%"></div></div></div><div class="session-count mono">${s.cursor+1}/${s.queue.length}</div><div class="timer-pill" id="q-timer">${fmtTime(activeElapsed())}</div></div>
${isExit&&!s.isFinal?'<span class="badge accent exit-label">Prueba de salida / reaprendizaje</span>':''}
<div class="question-card"><div class="question-meta"><span class="badge">${esc(q.reference)}</span><span class="badge">${q.type==='verdadero_falso'?'Verdadero/Falso':q.type==='completar'?'Completar':'Seleccionar'}</span><span class="badge ${q.difficulty==='trampa'?'warn':''}">${esc(q.difficulty)}</span>${s.isFinal?'<span class="badge bad">Modo Final</span>':''}</div><div class="question-text">${highlightNegations(q.prompt)}</div>
${s.stage==='thinking'?`<div class="think-box"><div class="small strong">Recuerda mentalmente antes de mirar</div><div class="count mono" id="think-count">${state.settings.thinkSeconds}</div><button class="btn small-btn" onclick="revealOptions()">Ya lo pensé</button></div>`:''}
${s.stage!=='thinking'?`<div class="options">${opts.map((o,i)=>{let cls='option';if(s.selected===i)cls+=' selected';if(feedback&&o===q.correctAnswer)cls+=' correct';if(feedback&&s.selected===i&&o!==q.correctAnswer)cls+=' wrong';return`<button class="${cls}" ${feedback||s.stage==='saved'?'disabled':''} onclick="selectOption(${i})"><span class="option-key">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`}).join('')}</div>`:''}
${!feedback&&!['saved'].includes(s.stage)?`<div class="question-actions"><button class="btn ghost" onclick="submitCurrent(true)">Saltar</button><div class="right"><button class="btn primary" onclick="submitCurrent(false)" ${s.stage==='answering'&&s.selected!==null?'':'disabled'}>Confirmar</button></div></div>`:''}
${feedback?renderFeedback(q,a):''}
</div></section>`}
function renderFeedback(q,a){const good=a.correct,reason=!good&&!a.skipped?(q.distractorReasons?.[a.selected]||'La opción elegida no coincide con el fragmento probatorio.'):'' ,contrast=!good&&!a.skipped?`<div class="callout warn"><div class="tiny strong">CONTRASTE TEXTUAL</div><div class="small">Tu opción: «${esc(a.selected)}». El texto dice: «${esc(q.correctAnswer)}».</div>${reason?`<div class="small" style="margin-top:6px"><strong>Por qué no corresponde:</strong> ${esc(reason)}</div>`:''}</div></div>`:'';return`<div class="feedback"><div class="feedback-title"><span>${good?'✓':a.skipped?'—':'×'}</span><span>${good?'Respuesta correcta':a.skipped?'Pregunta omitida':'Respuesta incorrecta'}</span></div><div class="feedback-grid"><div class="feedback-item"><div class="label">Tu respuesta</div><div>${esc(a.selected||'No respondida')}</div></div><div class="feedback-item"><div class="label">Respuesta correcta</div><div>${esc(q.correctAnswer)}</div></div></div>${contrast}<p class="small" style="margin:14px 0 8px"><strong>Detalle evaluado:</strong> ${esc(q.detail)}${!good?` · <strong>Posible error:</strong> ${esc(inferErrorTag(q,a))}`:''}</p><div class="evidence"><div class="tiny strong" style="margin-bottom:5px">${esc(q.reference)} · FRAGMENTO EXACTO</div>${esc(q.evidence)}</div><p class="small">${esc(q.explanation)}</p><div class="btn-row"><button class="btn small-btn" onclick="toggleContext()">Abrir contexto</button><button class="btn small-btn ${a.reviewed?'primary':''}" onclick="markCorrectionReviewed()" ${a.reviewed?'disabled':''}>${a.reviewed?'Revisión registrada':'Ya repetí mentalmente la correcta'}</button></div><div id="context-box" class="context-box hidden">${esc(q.context)}</div>${a.skipped?`<div class="question-actions"><span class="small muted">La omisión queda registrada.</span><div class="right"><button class="btn primary" onclick="nextQuestion()">Siguiente</button></div></div>`:!a.confidence?`<div style="margin-top:18px"><div class="small strong">¿Con qué confianza respondiste?</div><div class="confidence"><button onclick="setConfidence('Seguro')">Seguro</button><button onclick="setConfidence('Dudé')">Dudé</button><button onclick="setConfidence('Adiviné')">Adiviné</button></div></div>`:`<div class="question-actions"><span class="badge accent">${esc(a.confidence)}</span><div class="right"><button class="btn primary" onclick="nextQuestion()">Siguiente</button></div></div>`}</div>`}
function toggleContext(){$('#context-box')?.classList.toggle('hidden')}
function updateSessionClock(){const el=$('#q-timer');if(el)el.textContent=fmtTime(activeElapsed());const s=session();if(s?.stage==='thinking'&&Date.now()>=s.thinkUntil)revealOptions()}
function updateThink(){const el=$('#think-count'),s=session();if(el&&s)el.textContent=Math.max(0,Math.ceil((s.thinkUntil-Date.now())/1000))}

function renderText(){const sources=getSources(),selected=sources.find(s=>s.id===state.ui.textSource)||sources[0],weakOnly=state.ui.weakOnly;const units=selected.units.filter(u=>!weakOnly||getQuestions().filter(q=>q.unitKey===u.unitKey).some(q=>{const p=progressFor(q.id);return p.errors||p.status==='Débil'||p.status==='Recaída'||p.status.startsWith('Urgente')}));return`<section class="page"><div class="page-head"><div><div class="eyebrow">Texto base</div><h1>Lectura enfocada</h1><p class="muted">Redacción original conservada. En Modo Final este texto permanece oculto hasta terminar.</p></div></div><div class="text-toolbar"><div class="segmented">${sources.map(s=>`<button class="${s.id===selected.id?'active':''}" onclick="state.ui.textSource='${esc(s.id)}';saveState();render()">${esc(s.chapter)}</button>`).join('')}</div><label class="btn small-btn"><input type="checkbox" ${weakOnly?'checked':''} onchange="state.ui.weakOnly=this.checked;saveState();render()"> Leer solo lo que estoy fallando</label></div><div class="callout"><div class="small"><strong>Ciclo:</strong> lee el fragmento → ocúltalo mentalmente → recuerda → responde 3–5 preguntas → corrige → comprueba después.</div></div><div class="source-block" style="margin-top:16px"><div class="card compact"><div class="strong">${esc(selected.title)}</div><div class="small muted">${esc(selected.version)} · ${selected.units.length} unidades sustantivas</div></div>${units.length?units.map(u=>{const weak=getQuestions().filter(q=>q.unitKey===u.unitKey).some(q=>progressFor(q.id).errors>0);return`<article class="text-unit ${weak?'weak':''}" id="${esc(u.unitKey)}"><div class="text-ref">${esc(u.reference)}</div><div class="text-body">${esc(u.text)}</div>${weak?'<div class="tiny" style="color:var(--bad);margin-top:8px">Relacionado con errores actuales</div>':''}</article>`}).join(''):'<div class="card"><p class="muted">No hay fragmentos débiles en esta fuente.</p></div>'}</div></section>`}

function renderProgress(){const g=globalReadiness(),profiles=getProfiles().filter(p=>p.chapter!=='Banco combinado'),cal=confidenceCalibration(),errors=allProgress().filter(x=>x.p.errors>0).sort((a,b)=>(b.p.safeErrors*10+b.p.errors)-(a.p.safeErrors*10+a.p.errors)).slice(0,12);return`<section class="page"><div class="page-head"><div><div class="eyebrow">Pulso de precisión</div><h1>Progreso y riesgos actuales</h1><p class="muted">La velocidad pesa solo 5%; precisión, retención, cobertura y corrección pesan mucho más.</p></div><span class="badge ${g.score>=93?'good':g.score<70?'bad':'warn'}">Global ${g.score}/100</span></div><div class="grid two">${profiles.map(p=>{const r=readiness(p.chapter),tg=timeGoal(p.chapter);return`<div class="card"><div class="btn-row" style="justify-content:space-between"><div><h2>${esc(p.chapter)}</h2><div class="small muted">Complejidad ${p.complexity}/100 · meta competitiva ${p.competitiveGoal}%</div></div><div class="audit-number">${r.score}</div></div><div class="progress-track"><div class="progress-fill" style="--value:${r.score}%"></div></div><p class="small" style="margin:10px 0 14px">${esc(r.label)}${r.score<100?' — no garantiza un resultado competitivo.':''}</p><div class="breakdown"><div class="metric"><div class="metric-value">${round(r.recentAcc)}%</div><div class="metric-label">Precisión</div></div><div class="metric"><div class="metric-value">${round(r.hardAcc)}%</div><div class="metric-label">Difíciles</div></div><div class="metric"><div class="metric-value">${round(r.retention)}%</div><div class="metric-label">Retención</div></div><div class="metric"><div class="metric-value">${round(r.coverage)}%</div><div class="metric-label">Cobertura</div></div></div><div class="small" style="margin-top:14px"><strong>Meta de tiempo:</strong> ${tg.ready?tg.label:`calibrando (${tg.count}/${tg.needed})`}<br><strong>Persistentes:</strong> ${r.persistent} · <strong>Días con aciertos:</strong> ${r.correctDays}</div><button class="btn block" style="margin-top:14px" onclick="startMode('adaptive',{chapter:'${esc(p.chapter)}',count:25})">Entrenar este capítulo</button></div>`}).join('')}</div>
<div class="section-title"><h2>Calibración de confianza</h2></div><div class="metric-grid"><div class="metric"><div class="metric-value">${cal.safeCorrect}</div><div class="metric-label">Seguras correctas</div></div><div class="metric"><div class="metric-value">${cal.safeWrong}</div><div class="metric-label">Seguras incorrectas</div></div><div class="metric"><div class="metric-value">${cal.doubtedCorrect}</div><div class="metric-label">Aciertos dudados</div></div><div class="metric"><div class="metric-value">${cal.guessedCorrect}</div><div class="metric-label">Aciertos adivinados</div></div><div class="metric"><div class="metric-value">${state.sessions.length}</div><div class="metric-label">Sesiones</div></div><div class="metric"><div class="metric-value">${Object.keys(state.studyDays).length}</div><div class="metric-label">Días activos</div></div></div>
<div class="section-title"><h2>Lo que debes repasar</h2><button class="btn small-btn" onclick="startMode('errors',{chapter:'all',count:25})">Abrir ronda</button></div>${errors.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Referencia</th><th>Detalle</th><th>Errores</th><th>Riesgo</th><th>Próxima revisión</th></tr></thead><tbody>${errors.map(({q,p})=>`<tr><td><strong>${esc(q.reference)}</strong><br><span class="tiny">${esc(q.prompt.slice(0,90))}${q.prompt.length>90?'…':''}</span></td><td>${esc(q.detail)}</td><td>${p.errors}${p.safeErrors?` · ${p.safeErrors} seguros`:''}</td><td>${esc(p.errorTag||p.status)}</td><td>${fmtDate(p.nextDue,{day:'numeric',month:'short'})}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card"><p class="muted">Todavía no hay errores registrados.</p></div>'}</section>`}
function confidenceCalibration(){const a=state.answers;return{safeCorrect:a.filter(x=>x.correct&&x.confidence==='Seguro').length,safeWrong:a.filter(x=>!x.correct&&x.confidence==='Seguro').length,doubtedCorrect:a.filter(x=>x.correct&&x.confidence==='Dudé').length,guessedCorrect:a.filter(x=>x.correct&&x.confidence==='Adiviné').length}}

function renderAudit(){const a=DATA.audit;return`<section class="page"><div class="page-head"><div><div class="eyebrow">Auditoría del banco</div><h1>Fidelidad, cobertura y controles</h1><p class="muted">Generación y crítica adversarial antes de activar cada pregunta.</p></div><span class="badge good">Banco ${esc(a.bankVersion)}</span></div><div class="grid four"><div class="card compact"><div class="audit-number">${a.created}</div><div class="audit-label">Preguntas creadas</div></div><div class="card compact"><div class="audit-number">${a.valid}</div><div class="audit-label">Válidas</div></div><div class="card compact"><div class="audit-number">${a.corrected}</div><div class="audit-label">Corregidas</div></div><div class="card compact"><div class="audit-number">${a.excluded}</div><div class="audit-label">Excluidas</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h2>Cobertura</h2>${Object.entries(a.coverage).map(([ch,c])=>`<div class="chapter-row"><div><strong>${esc(ch)}</strong><div class="small muted">${c.covered}/${c.total} referencias</div></div><div class="progress-track"><div class="progress-fill" style="--value:${100*c.covered/c.total}%"></div></div><span class="badge good">100%</span></div>`).join('')}<p class="small muted" style="margin:12px 0 0">Unidades sin pregunta: ${a.unitsWithoutQuestion}</p></div><div class="card"><h2>Distribución</h2><div class="table-wrap"><table class="table" style="min-width:0"><tbody>${Object.entries(a.typeCounts).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}${Object.entries(a.difficultyCounts).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</tbody></table></div><p class="small muted" style="margin-top:10px">Posiciones correctas (sin V/F): ${Object.values(a.correctPositionCounts).join(' / ')}.<br>Pistas excesivas por longitud: ${a.optionLengthWarnings||0} · opciones fuera de la fuente: ${a.sourceOptionViolations||0}.</p></div></div>
<div class="section-title"><h2>Perfil del capítulo</h2></div><div class="grid two">${getProfiles().filter(p=>p.chapter!=='Banco combinado').map(p=>`<div class="card"><div class="btn-row" style="justify-content:space-between"><h2>${esc(p.chapter)}</h2><span class="badge warn">Complejidad ${p.complexity}</span></div><div class="small"><strong>${p.questions}</strong> preguntas · <strong>${p.words}</strong> palabras · <strong>${p.hardTrap}</strong> difíciles/trampa · <strong>${p.exactPhrases}</strong> completar exactas</div><p class="small" style="margin-top:12px"><strong>Meta competitiva:</strong> ${p.competitiveGoal}%<br><strong>Puntuación perfecta:</strong> 100%<br><strong>Evidencia:</strong> ${esc(p.evidenceRequirement)}</p></div>`).join('')}</div>
<div class="section-title"><h2>Fórmula transparente</h2></div><div class="card"><div class="formula">complejidad = 100 × clamp(
  0.20 × densidad_de_unidades +

)</div><p class="small muted" style="margin:12px 0 0">Cada componente se normaliza de 0 a 1 usando las unidades y preguntas cargadas. La complejidad no autoriza preguntas ambiguas.</p></div>
<div class="section-title"><h2>Validaciones aplicadas</h2></div><div class="card"><div class="grid two"><div><h3>Banco y fidelidad</h3><p class="small muted">IDs únicos; solo tres tipos; una respuesta; evidencia literal; completar exacto; V/F con alteración explícita; opciones sin duplicados; referencias existentes; sin conocimiento externo; orden de respuestas equilibrado.</p></div><div><h3>Aprendizaje y entrega</h3><p class="small muted">Temporizador por estados; Final sin confianza ni corrección; Piensa primero; reaparición demorada; fechas de repaso; recaída; metas; persistencia; importación segura; funcionamiento sin red.</p></div></div></div>
<div class="section-title"><h2>Advertencias reales</h2></div><div class="card">${a.warnings.map(w=>`<div class="callout warn" style="margin-bottom:9px"><div class="small">${esc(w)}</div></div>`).join('')}</div></section>`}

function renderSettings(){return`<section class="page"><div class="page-head"><div><div class="eyebrow">Ajustes</div><h1>Preferencias y datos</h1><p class="muted">Todo permanece en este dispositivo; la aplicación no envía información a internet.</p></div></div><div class="grid two"><div class="card"><h2>Entrenamiento</h2><div class="switch-row"><div><div class="strong">Piensa primero</div><div class="small muted">Oculta opciones en aprendizaje, precisión y repaso.</div></div><label class="switch"><input type="checkbox" ${state.settings.thinkFirst?'checked':''} onchange="state.settings.thinkFirst=this.checked;saveState()"><span></span></label></div><div class="switch-row"><div><div class="strong">Pausar práctica al ocultar pestaña</div><div class="small muted">Modo Final continúa y registra interrupción.</div></div><label class="switch"><input type="checkbox" ${state.settings.pausePracticeWhenHidden?'checked':''} onchange="state.settings.pausePracticeWhenHidden=this.checked;saveState()"><span></span></label></div><div class="field" style="margin-top:14px"><label>Segundos de Piensa primero (2–4)</label><select onchange="state.settings.thinkSeconds=Number(this.value);saveState()">${[2,3,4].map(n=>`<option ${state.settings.thinkSeconds===n?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="card"><h2>Apariencia</h2><div class="field"><label>Tema</label><select onchange="state.settings.theme=this.value;saveState();applyTheme()"><option value="system" ${state.settings.theme==='system'?'selected':''}>Sistema</option><option value="light" ${state.settings.theme==='light'?'selected':''}>Claro</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Oscuro</option></select></div><p class="small muted" style="margin-top:14px">Tipografía del sistema, contraste alto y controles grandes para Android y computadora.</p></div></div>
<div class="section-title"><h2>Exportar e importar</h2></div><div class="card"><div class="grid two"><div><h3>Progreso</h3><p class="small muted">Incluye historial, tiempos, confianza, próximas revisiones y sesión activa.</p><div class="btn-row"><button class="btn" onclick="exportProgress()">Exportar progreso JSON</button><button class="btn" onclick="chooseFile('progress')">Importar progreso</button></div></div><div><h3>Banco acumulativo</h3><p class="small muted">Permite unir otros capítulos compatibles; deduplica por ID y contenido.</p><div class="btn-row"><button class="btn" onclick="exportBank()">Exportar banco</button><button class="btn" onclick="chooseFile('bank')">Importar banco</button></div></div></div></div>
<div class="section-title"><h2>Clasificación</h2></div><div class="card"><div class="switch-row"><div><div class="strong">Clasifiqué a distrito</div><div class="small muted">Cambia la siguiente fecha prioritaria al 22 de agosto.</div></div><label class="switch"><input type="checkbox" ${state.classifications.church?'checked':''} onchange="state.classifications.church=this.checked;saveState();render()"><span></span></label></div><div class="switch-row"><div><div class="strong">Clasifiqué a asociación</div><div class="small muted">Cambia la siguiente fecha prioritaria al 29 de agosto.</div></div><label class="switch"><input type="checkbox" ${state.classifications.district?'checked':''} onchange="state.classifications.district=this.checked;saveState();render()"><span></span></label></div></div>
<div class="section-title"><h2>Reinicio</h2></div><div class="card"><p class="small muted">El banco integrado no se elimina, pero sí todo tu progreso, historial y ajustes. Exporta antes de reiniciar.</p><button class="btn danger" onclick="confirmReset()">Reiniciar todos los datos</button></div>
<div class="section-title"><h2>Cómo se calcula el tiempo</h2></div><div class="card"><p class="small">Se requieren 20 respuestas correctas válidas por capítulo o 12 para una combinación tipo+dificultad. Se excluyen errores, omisiones, adivinadas, interrupciones, tiempos menores de 1 segundo y valores superiores a Q3 + 3×IQR. La meta inicial usa P60; con precisión ≥95% y retención usa P50. La reducción queda limitada a 8% por ciclo y 10% en dos sesiones.</p></div></section>`}
function downloadJSON(name,obj){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportProgress(){downloadJSON(`conexion-biblica-progreso-${todayKey()}.json`,{kind:'cb2026-progress',schemaVersion:SCHEMA_VERSION,bankVersion:DATA.meta.bankVersion,exportedAt:new Date().toISOString(),state})}
function exportBank(){downloadJSON(`conexion-biblica-banco-${todayKey()}.json`,{kind:'cb2026-bank',version:DATA.meta.bankVersion,exportedAt:new Date().toISOString(),questions:getQuestions(),sources:getSources(),profiles:getProfiles()})}
function chooseFile(intent){fileIntent=intent;const i=$('#file-input');i.value='';i.click()}
function validQuestion(q){return q&&typeof q.id==='string'&&['seleccionar','verdadero_falso','completar'].includes(q.type)&&Array.isArray(q.options)&&q.options.includes(q.correctAnswer)&&typeof q.evidence==='string'&&q.evidence.length>0}
function importFile(file){const r=new FileReader();r.onload=()=>{try{const obj=JSON.parse(r.result);if(fileIntent==='progress'){if(obj.kind!=='cb2026-progress'||!obj.state||!Array.isArray(obj.state.answers))throw Error('Archivo de progreso no compatible');const backup=state;try{state=mergeDefaults(obj.state);saveState();toast('Progreso importado correctamente.');render()}catch(e){state=backup;throw e}}else{if(obj.kind!=='cb2026-bank'||!Array.isArray(obj.questions)||!obj.questions.every(validQuestion))throw Error('Banco inválido o incompatible');const existingIds=new Set(getQuestions().map(q=>q.id)),existingSigs=new Set(getQuestions().map(questionSignature)),fresh=[];for(const q of obj.questions){const sig=questionSignature(q);if(existingIds.has(q.id)||existingSigs.has(sig))continue;existingIds.add(q.id);existingSigs.add(sig);fresh.push(q)};state.importedBanks.push({id:id(),version:obj.version||'importado',questions:fresh,sources:Array.isArray(obj.sources)?obj.sources:[],profiles:Array.isArray(obj.profiles)?obj.profiles:[],importedAt:new Date().toISOString()});saveState();toast(`Banco importado: ${fresh.length} preguntas nuevas.`);render()}}catch(e){toast(`Importación rechazada: ${e.message}`,true)}};r.onerror=()=>toast('No se pudo leer el archivo.',true);r.readAsText(file)}
function confirmReset(){modal('Confirmar reinicio','<p>Se eliminarán progreso, sesiones, tiempos, confianza y bancos importados. Esta acción no se puede deshacer.</p>',`<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="resetAll()">Reiniciar</button>`)}
function resetAll(){closeModal();state=defaultState();if(!memoryOnly){try{localStorage.removeItem(STORAGE_KEY)}catch{}}saveState();applyTheme();currentView='home';render();toast('Datos reiniciados.')}

function renderResults(){const r=state.lastResult;if(!r)return`<div class="card"><p>No hay resultados recientes.</p><button class="btn" onclick="setView('train')">Entrenar</button></div>`;const valid=r.answers.filter(a=>!a.skipped),fast=valid.length?valid.reduce((a,b)=>a.activeMs<b.activeMs?a:b):null,slow=valid.length?valid.reduce((a,b)=>a.activeMs>b.activeMs?a:b):null,imp=valid.filter(a=>a.activeMs<1500).length;const byType=groupStats(r.answers,'type'),byDiff=groupStats(r.answers,'difficulty'),byChapter=groupStats(r.answers,'chapter');const profile=r.chapters.length===1?getProfiles().find(p=>p.chapter===r.chapters[0]):getProfiles().find(p=>p.chapter==='Banco combinado'),goal=profile?.competitiveGoal||98,perfect=r.accuracy===100&&r.skipped===0;const diag=coachDiagnosis(r,goal),errors=r.answers.filter(a=>!a.correct);return`<section class="page"><div class="result-hero card"><div class="eyebrow">Resultado de la sesión</div><div class="result-score">${round(r.accuracy,1)}%</div><div class="result-distance">${perfect?'Puntuación perfecta: 100%, sin errores ni omitidas.':`Distancia a la puntuación perfecta: ${round(100-r.accuracy,1)} puntos · ${r.errors} errores · ${r.skipped} omitidas.`}</div><div class="btn-row" style="justify-content:center;margin-top:18px"><span class="badge ${r.accuracy>=goal?'good':'warn'}">Meta competitiva ${goal}% ${r.accuracy>=goal&&r.skipped===0?'cumplida':'no cumplida'}</span>${r.isFinal?'<span class="badge bad">Modo Final</span>':''}</div></div>
<div class="metric-grid" style="margin-top:16px"><div class="metric"><div class="metric-value">${r.correct}</div><div class="metric-label">Aciertos</div></div><div class="metric"><div class="metric-value">${r.errors}</div><div class="metric-label">Errores</div></div><div class="metric"><div class="metric-value">${r.skipped}</div><div class="metric-label">No respondidas</div></div><div class="metric"><div class="metric-value">${fmtTime(r.activeMs)}</div><div class="metric-label">Tiempo activo</div></div><div class="metric"><div class="metric-value">${fmtTime(r.totalMs)}</div><div class="metric-label">Tiempo total</div></div><div class="metric"><div class="metric-value">${fmtTime(r.answers.length?r.activeMs/r.answers.length:0)}</div><div class="metric-label">Promedio activo</div></div></div>
<div class="grid two" style="margin-top:16px"><div class="card"><h2>Informe del entrenador</h2><div class="callout ${r.accuracy>=goal?'good':r.accuracy<80?'bad':'warn'}">${esc(diag.message)}</div><p class="small" style="margin-top:14px"><strong>Siguiente acción:</strong> ${esc(diag.action)}</p><div class="small muted">Más rápida válida: ${fast?fmtTime(fast.activeMs):'—'} · Más lenta: ${slow?fmtTime(slow.activeMs):'—'} · Impulsivas: ${imp} · Interrupciones: ${r.interruptions}</div></div><div class="card"><h2>Cambios de estado</h2><p class="small">${r.answers.filter(a=>progressFor(a.qid).status==='Recaída').length} recaídas · ${r.answers.filter(a=>progressFor(a.qid).status==='Dominada').length} dominadas · ${r.answers.filter(a=>progressFor(a.qid).persistent).length} persistentes.</p><p class="small muted">Próxima revisión prioritaria: ${nextReviewDate(r.answers)}</p></div></div>
<div class="section-title"><h2>Desglose</h2></div><div class="grid three">${statCard('Por tipo',byType)}${statCard('Por dificultad',byDiff)}${statCard('Por capítulo',byChapter)}</div>
<div class="section-title"><h2>Lo que debes repasar</h2></div>${errors.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Pregunta</th><th>Tu respuesta</th><th>Correcta</th><th>Referencia</th><th>Próxima</th></tr></thead><tbody>${errors.map(a=>{const q=questionById(a.qid),p=progressFor(a.qid);return`<tr><td>${esc(a.question)}</td><td>${esc(a.selected||'No respondida')}</td><td>${esc(a.correctAnswer)}</td><td>${esc(a.reference)}<br><span class="tiny">${esc(q?.evidence||'')}</span></td><td>${fmtDate(p.nextDue,{day:'numeric',month:'short'})}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="card"><p>No hubo errores en esta sesión.</p></div>'}<div class="btn-row" style="margin-top:18px"><button class="btn" onclick="setView('home')">Inicio</button>${errors.length?`<button class="btn" onclick="startMode('errors',{chapter:'all',count:${Math.min(25,errors.length*2)}})">Corregir errores</button>`:''}<button class="btn primary" onclick="startMode('adaptive',{chapter:'all',count:25})">Siguiente ronda</button></div><p class="motto" style="text-align:center;margin-top:28px">${esc(DATA.meta.motto)}</p></section>`}
function groupStats(arr,key){const g={};for(const a of arr){const k=a[key]||'Sin dato';if(!g[k])g[k]={n:0,c:0,time:0};g[k].n++;g[k].c+=a.correct?1:0;g[k].time+=a.activeMs}return g}
function statCard(title,stats){return`<div class="card"><h3>${esc(title)}</h3>${Object.entries(stats).map(([k,v])=>`<div style="margin-top:10px"><div class="btn-row" style="justify-content:space-between"><span class="small">${esc(k)}</span><span class="small strong">${round(100*v.c/v.n)}%</span></div><div class="progress-track"><div class="progress-fill" style="--value:${100*v.c/v.n}%"></div></div><div class="tiny muted">${v.c}/${v.n} · ${fmtTime(v.time/v.n)}</div></div>`).join('')}</div>`}
function coachDiagnosis(r,goal){const wrong=r.answers.filter(a=>!a.correct),byDetail=Object.entries(groupStats(r.answers,'detail')).sort((a,b)=>(a[1].c/a[1].n)-(b[1].c/b[1].n)),weak=byDetail[0]?.[0]||'precisión general';const safe=wrong.filter(a=>a.confidence==='Seguro').length,hard=accuracy(r.answers.filter(a=>['difícil','trampa'].includes(a.difficulty)));if(r.accuracy>=goal&&hard>=95&&safe===0)return{message:`La precisión alcanzó la meta y las preguntas difíciles quedaron en ${round(hard)}%. La siguiente evidencia debe venir en otro día.`,action:'Haz una comprobación retrasada de 20–25 preguntas mañana; no reduzcas el tiempo si aparece un error seguro.'};if(safe)return{message:`Hay ${safe} error${safe>1?'es':''} respondido${safe>1?'s':''} con seguridad. Eso indica falsa seguridad y recibe máxima prioridad.`,action:`Trabaja 10–20 preguntas del detalle «${weak}», revisa el fragmento exacto y repite después de otras preguntas.`};if(r.accuracy<85)return{message:`La base todavía es vulnerable. El detalle más débil fue «${weak}» y la precisión global quedó en ${round(r.accuracy)}%.`,action:`Abre una ronda de corrección de errores y después una prueba de salida corta; no entrenes velocidad todavía.`};return{message:`La precisión va en construcción, pero «${weak}» sigue por debajo del resto. Las difíciles quedaron en ${round(hard)}%.`,action:`Resuelve 20 preguntas centradas en «${weak}» y luego comprueba retención en una ronda mixta.`}}
function nextReviewDate(answers){const dates=answers.map(a=>progressFor(a.qid).nextDue).sort();return dates[0]?fmtDate(dates[0]):'sin fecha'}

// events and boot
document.addEventListener('click',e=>{const b=e.target.closest('#nav button');if(b)setView(b.dataset.view)});
$('#theme-btn').addEventListener('click',cycleTheme);
$('#file-input').addEventListener('change',e=>{if(e.target.files[0])importFile(e.target.files[0])});
document.addEventListener('visibilitychange',()=>{const s=session();if(!s||!['thinking','answering'].includes(s.stage))return;if(document.hidden){if(s.isFinal){s.interruptions++;if(s.qTimer)s.qTimer.interrupted=true;saveState()}else if(state.settings.pausePracticeWhenHidden)pausePractice('pestaña oculta')}else if(!s.isFinal&&state.settings.pausePracticeWhenHidden){toast('La práctica quedó pausada mientras la pestaña estuvo oculta.');resumePracticeTimer()}});
window.addEventListener('pagehide',()=>{if(session()&&!session().isFinal)pausePractice('salida o recarga');saveState()});
window.addEventListener('orientationchange',()=>saveState());
window.addEventListener('beforeunload',saveState);
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',()=>{if(state.settings.theme==='system')applyTheme()});
loadState();applyTheme();headerDate();setInterval(headerDate,60000);if(state.currentSession)resumeSession();else render();
</script>
</body>
</html>
